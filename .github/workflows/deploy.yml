name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'   # prevent infinite loop when this workflow commits docs/

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        run: pnpm run build:github-pages

      - name: Add 404.html for SPA routing
        run: cp docs/index.html docs/404.html

      - name: Add CNAME and nojekyll
        run: |
          echo "www.8bitsdev.click" > docs/CNAME
          touch docs/.nojekyll

      - name: Commit docs/ to master
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "deploy: update built site in docs/ [skip ci]"
          git push origin master